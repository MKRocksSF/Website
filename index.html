<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Rocks</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 6rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow:
        0 0 20px #e94560,
        0 0 40px #e94560,
        0 0 80px #e94560;
      animation: pulse 2s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 1rem;
      font-size: 1.5rem;
      color: #e94560;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px #e94560, 0 0 40px #e94560, 0 0 80px #e94560; }
      50%       { text-shadow: 0 0 40px #e94560, 0 0 80px #e94560, 0 0 120px #e94560; }
    }

    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--duration) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50%       { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <h1>Michael Rocks</h1>
    <p class="subtitle">&#9733; Legend &#9733;</p>
  </div>

  <script>
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      const size = Math.random() * 3 + 1;
      star.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        --duration: ${Math.random() * 3 + 2}s;
        animation-delay: ${Math.random() * 3}s;
      `;
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
