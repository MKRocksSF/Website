<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Rocks</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .screen {
      border: 4px solid #00f;
      box-shadow: 0 0 30px #00f, inset 0 0 30px rgba(0,0,255,0.1);
      padding: clamp(1rem, 4vw, 3rem) clamp(1.5rem, 6vw, 4rem);
      text-align: center;
      max-width: 95vw;
    }

    .insert-coin {
      font-size: clamp(0.4rem, 1.5vw, 0.65rem);
      color: #00f;
      letter-spacing: 0.15em;
      margin-bottom: clamp(0.8rem, 3vw, 1.5rem);
      animation: blink 1s step-end infinite;
    }

    h1 {
      font-size: clamp(1.2rem, 6vw, 4rem);
      color: #4af;
      text-shadow:
        0 0 10px #00f,
        0 0 20px #00f,
        4px 4px 0 #003;
      line-height: 1.4;
      white-space: nowrap;
      animation: flicker 4s infinite;
    }

    .score {
      margin-top: clamp(0.8rem, 3vw, 1.5rem);
      font-size: clamp(0.4rem, 1.5vw, 0.65rem);
      color: #4af;
      letter-spacing: 0.1em;
    }

    .score span {
      color: #fff;
    }

    .lives {
      margin-top: clamp(0.5rem, 2vw, 1rem);
      font-size: clamp(0.4rem, 1.5vw, 0.65rem);
      color: #4af;
    }

    .pixel-art {
      margin-top: clamp(0.8rem, 3vw, 1.5rem);
      font-size: clamp(0.5rem, 1.8vw, 0.8rem);
      color: #4af;
      line-height: 1.6;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes flicker {
      0%, 97%, 100% { opacity: 1; }
      98%           { opacity: 0.4; }
      99%           { opacity: 1; }
      99.5%         { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <p class="insert-coin">&gt;&gt; INSERT COIN TO CONTINUE &lt;&lt;</p>
    <h1>MICHAEL<br>ROCKS</h1>
    <div class="pixel-art">▄█▄ ▄█▄ ▄█▄</div>
    <p class="score">HIGH SCORE: <span>9,999,999</span></p>
    <p class="lives">LIVES: ♥ ♥ ♥</p>
  </div>
</body>
</html>
